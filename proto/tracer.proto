syntax = "proto3";
package clangtracer.v1;

import "context_transport.proto";

// All public control and event traffic uses gRPC and binary Protobuf.
service Tracer {
  rpc Attach(AttachRequest) returns (Session);
  // Resolve on the tracing host, so remote clients need no target files.
  rpc ResolveProbe(ResolveProbeRequest) returns (ProbeSpec);
  rpc ValidateProbe(ValidateProbeRequest) returns (ValidationReport);
  rpc AddProbe(AddProbeRequest) returns (Probe);
  rpc RemoveProbe(RemoveProbeRequest) returns (Probe);
  rpc Detach(DetachRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListModules(ListModulesRequest) returns (ListModulesResponse);
  rpc ListMemoryMappings(ListMemoryMappingsRequest) returns (ListMemoryMappingsResponse);
  rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);
  rpc ScanMemory(ScanMemoryRequest) returns (ScanMemoryResponse);
  rpc PreviewFunctionEntry(PreviewFunctionEntryRequest) returns (PreviewFunctionEntryResponse);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc ListSymbols(ListSymbolsRequest) returns (ListSymbolsResponse);
  rpc PreviewBulkTrace(PreviewBulkTraceRequest) returns (PreviewBulkTraceResponse);
  rpc ApplyBulkTrace(ApplyBulkTraceRequest) returns (BulkTraceReport);
  rpc RemoveBulkTrace(RemoveBulkTraceRequest) returns (BulkTraceReport);
  rpc WatchEvents(WatchEventsRequest) returns (stream TraceEvent);
  // Snapshot retained events; acknowledge only after storage commits.
  rpc ReadEvents(ReadEventsRequest) returns (ReadEventsResponse);
  rpc AcknowledgeEvents(AcknowledgeEventsRequest) returns (AcknowledgeEventsResponse);
}

enum ValueType {
  VALUE_TYPE_UNSPECIFIED = 0;
  VOID = 1;
  INT32 = 2;
  INT64 = 3;
  UINT64 = 4;
  FLOAT32 = 5;
  FLOAT64 = 6;
  POINTER = 7;
  OBJECT = 8; // Borrowed object argument or POST result address; callback-scoped.
  BOOL = 9;
}
enum CallableKind {
  CALLABLE_KIND_UNSPECIFIED = 0;
  FUNCTION = 1; // Includes static member functions.
  METHOD = 2; // Non-static Itanium ABI method; hidden this pointer is captured.
}
enum TracePhase {
  TRACE_PHASE_UNSPECIFIED = 0;
  PRE = 1;
  POST = 2;
}
message Signature {
  CallableKind kind = 1;
  ValueType result = 2;
  repeated ValueType arguments = 3; // Up to eight scalar, indirect, or ABI-proven object arguments.
}
message ReceiverField {
  string name = 1;
  string canonical_type = 2;
  uint64 bit_offset = 3;
  uint32 bit_width = 4; // Zero for an ordinary field.
  uint64 bit_size = 5;
  uint64 bit_alignment = 6;
  bool is_mutable = 7;
  string access = 8; // public, protected, or private.
  string abi_identity = 9; // Recursive target ABI identity for this field type.
}
message ReceiverContext {
  string translation_unit = 1;
  string working_directory = 2;
  repeated string compiler_arguments = 3; // Frozen Clang driver invocation.
  string record_name = 4;
  string clang_version = 5;
  string target_triple = 6;
  uint64 size = 7;
  uint64 alignment = 8;
  repeated ReceiverField fields = 9;
  bool is_volatile = 10;
}
message DebugField {
  string name = 1;
  string builtin_type = 2;
  uint64 byte_offset = 3;
  uint64 byte_size = 4;
  string access = 5;
  repeated DebugTypeLevel type_chain = 6;
}
// Outer type through terminal builtin/void, retaining pointee ABI facts that
// a spelling and the outer pointer width cannot prove.
message DebugTypeLevel {
  enum Kind { UNSPECIFIED = 0; POINTER = 1; BUILTIN = 2; VOID = 3; }
  Kind kind = 1;
  uint64 byte_size = 2;
  uint32 dwarf_encoding = 3;
  bool is_const = 4;
  bool is_volatile = 5;
}
enum RecordCallingConvention {
  RECORD_CALLING_CONVENTION_UNSPECIFIED = 0;
  RECORD_PASS_BY_VALUE = 1;
  RECORD_PASS_BY_REFERENCE = 2;
}
message DebugInfo {
  string module = 1;
  uint64 device = 2;
  uint64 inode = 3;
  uint64 file_size = 4;
  sint64 modification_ns = 5;
  sint64 change_ns = 6;
  string selector = 7;
  string record_name = 8;
  uint64 record_size = 9;
  repeated DebugField fields = 10;
  bool receiver_volatile = 11;
  repeated DebugArgument arguments = 12;
  uint64 entry_virtual_address = 13; // Concrete DWARF code range, before ASLR.
  uint64 entry_size = 14;
  uint64 runtime_entry = 15; // Revalidated against mapped ELF PT_LOAD identity.
  DebugInfo result_object_type = 16;
  string result_cpp_type = 17;
  bool result_is_object_value = 18;
  bool result_is_reference = 19;
  bool result_pass_by_reference = 20;
  repeated DebugMethod methods = 21;
  bool record_pass_by_reference = 22;
  bool record_is_opaque = 23;
  uint64 record_alignment = 24;
  RecordCallingConvention record_calling_convention = 25;
  bytes prepared_layout_sha256 = 26;
}
message DebugMethod {
  string name = 1;
  string linkage_symbol = 2;
  string cpp_result_type = 3;
  repeated string cpp_parameter_types = 4;
  bool is_const = 5;
  bool is_volatile = 6;
  bool is_static = 7;
  bool is_virtual = 8;
  uint64 runtime_entry = 9;
  uint32 calling_convention = 10;
  string ref_qualifier = 11;
  bool is_variadic = 12;
}
message DebugArgument {
  uint32 index = 1;
  string cpp_type = 2;
  bool is_reference = 3;
  bool is_object_value = 4;
  DebugInfo object_type = 5;
}
message HeaderContext {
  string working_directory = 1;
  repeated string compiler_arguments = 2; // Flags only; no donor source input.
  string inference = 3; // Clang's diagnostic identifying the selected command.
}
message PreparedInjector {
  uint32 format_version = 1; // 1/2 are scalar, 4 carries a standalone typed adapter.
  bytes module_sha256 = 2; // Required for pinned packages, empty otherwise.
  string module_name = 3; // Required for pinned packages, empty otherwise.
  string selector = 4;
  string symbol = 5;
  Signature signature = 6;
  repeated string argument_names = 7;
  string target_triple = 8;
  DebugInfo header_types = 9; // Source types and layouts, with no live addresses.
  repeated string include_headers = 10; // Legacy version 3.
  HeaderContext header_context = 11; // Legacy version 3.
  string adapter_declarations = 12;
  repeated string adapter_standard_headers = 13;
  repeated string adapter_abi_options = 14;
}
message ProbeSpec {
  string symbol = 1;       // Linkage name/diagnostic; export required only in raw-symbol mode.
  Signature signature = 2; // DWARF-inferred or explicitly supplied ABI contract.
  string callback_source = 3; // Legacy trace_callback or class Interceptor with
                              // optional pre/post(const Call&).
  ReceiverContext receiver = 4; // Clang-discovered original class context.
  string receiver_unavailable_reason = 5;
  DebugInfo debug_info = 6;
  repeated string argument_names = 7;
  repeated string include_headers = 8; // Optional headers; no target source required.
  HeaderContext header_context = 9; // Optional compilation database flags.
  uint32 stack_depth = 10; // Zero disables automatic entry capture; otherwise 1..64.
  bool include_internal_stack_frames = 11; // False defaults to application-only, including old clients.
  bool print_arguments = 12; // Optional callback PRE rendering; defaults off.
  bool print_result = 13; // Optional callback POST rendering; defaults off.
  reserved 14;
  reserved "callback_origin";
  // Source location is only used to locate retained engine package metadata;
  // the server assigns the lineage UUID and never accepts one from clients.
  string callback_package_path = 15;
  reserved 16;
  repeated string compile_options = 17;
  PreparedInjector prepared = 18;
}
message AttachRequest {
  uint32 pid = 1;
  // Libraries are discovered from the target; the former manual allowlist
  // field is retired and must never be reused.
  reserved 2;
  reserved "application_modules";
  uint64 expected_process_start_time = 3; // Zero selects by PID alone.
  string expected_executable = 4; // Exact /proc/PID/exe path, when selected locally.
}
message JitRuntimeProfile {
  string agent_build_id = 1; // GNU build ID of the loaded agent, in hex.
  uint32 bootstrap_protocol = 2;
  string target_abi = 3;
  string clang_version = 4;
  string llvm_version = 5;
  string glibc_version = 6;
  string cxx_runtime_path = 7; // Loaded provider of __cxa_throw, if known.
  uint32 libstdcxx_header_release = 8; // Agent build headers, if known.
  // The agent build default. Probe-specific flags and target signatures are
  // checked independently. Presence distinguishes the old ABI from unknown.
  optional bool libstdcxx_default_cxx11_abi = 9;
}
message Session {
  string id = 1;
  uint32 pid = 2;
  enum State {
    STATE_UNSPECIFIED = 0;
    ATTACHED = 1;
    DETACHED = 2;
    EXITED = 3;
    FAILED = 4;
  }
  State state = 3;
  repeated Probe probes = 4;
  string error = 5;
  repeated string application_modules =
      6; // Automatically discovered, pinned paths.
  uint64 process_start_time = 7; // Linux /proc start time in clock ticks.
  JitRuntimeProfile jit_runtime = 8;
  string executable = 9;
}
message AddProbeRequest {
  string session_id = 1;
  ProbeSpec spec = 2;
}
message ResolveProbeRequest {
  string session_id = 1;
  string selector = 2; // C++ declaration, e.g. Calculator::add(int).
  repeated string include_headers = 3; // Paths on the server host.
  string compilation_database = 4; // Optional path on the server host.
  string module = 5; // Optional mapped path substring; empty uses ELF symbol tables.
  uint64 debug_max_entries = 6; // Zero is unlimited.
  uint32 debug_max_depth = 7; // Zero is unlimited.
  repeated string compile_options = 8;
  PreparedInjector prepared = 9;
}
message ValidateProbeRequest {
  string session_id = 1;
  string selector = 2;
  string callback_source = 3;
  repeated string include_headers = 4;
  string compilation_database = 5;
  repeated string compile_options = 6;
  enum Level { COMPILE = 0; SYNTAX = 1; }
  Level level = 7;
  string module = 8;
  uint64 debug_max_entries = 9;
  uint32 debug_max_depth = 10;
  PreparedInjector prepared = 11;
}
message ValidationDiagnostic {
  string stage = 1;
  string severity = 2;
  string file = 3;
  uint32 line = 4;
  uint32 column = 5;
  string message = 6;
}
message ValidationReport {
  bool success = 1;
  ValidateProbeRequest.Level level = 2;
  repeated string effective_options = 3;
  repeated ValidationDiagnostic diagnostics = 4;
  bool prepared_used = 5;
}
message Probe {
  uint64 id = 1;
  string session_id = 2;
  string symbol = 3;
  Signature signature = 4;
  bool active = 5;
  uint64 callback_address = 6;
  uint64 entry_address = 7;
  bool original_bytes_restored = 8;
  uint64 agent_dropped_events = 9;
  uint64 callback_errors = 10;
  uint64 jit_compile_ns = 11; // Target-side compilation and materialization.
  uint64 patch_install_ns = 12; // Code patch attempts, including retries.
  string bulk_batch_id = 13; // Set only for probes owned by a bulk apply.
}
message RemoveProbeRequest {
  string session_id = 1;
  uint64 probe_id = 2;
}
message DetachRequest { string session_id = 1; }
message ListSessionsRequest {}
message ListSessionsResponse { repeated Session sessions = 1; }
message ListModulesRequest {
  string session_id = 1;
  bool include_mappings = 2;
}
message ModuleMapping {
  string path = 1;
  uint64 begin_address = 2;
  uint64 end_address = 3; // Exclusive.
  uint64 file_offset = 4;
  string device = 5;
  uint64 inode = 6;
  string build_id = 7; // GNU build ID when the mapped backing file is verified.
}
message ListModulesResponse {
  repeated string modules = 1;
  repeated ModuleMapping mappings = 2;
  string mapping_token = 3;
}
message ListMemoryMappingsRequest { string session_id = 1; }
message MemoryMapping {
  uint64 begin_address = 1;
  uint64 end_address = 2; // Exclusive.
  string permissions = 3; // Linux maps permissions such as r--p.
  uint64 file_offset = 4;
  string device = 5;
  uint64 inode = 6;
  bytes path = 7; // Path or label as reported by procfs.
}
message ListMemoryMappingsResponse {
  repeated MemoryMapping mappings = 1;
  string mapping_token = 2; // Bound to the selected session and mapping snapshot.
}
message ReadMemoryRequest {
  string session_id = 1;
  string mapping_token = 2;
  uint64 address = 3;
  uint32 size = 4; // 1..65536 bytes.
}
message ReadMemoryResponse {
  uint64 address = 1;
  bytes data = 2; // On success, exactly size bytes owned by the response.
}
message ScanMemoryRequest {
  string session_id = 1;
  string mapping_token = 2;
  uint64 address = 3;
  uint32 size = 4; // 1..1048576 bytes.
  bytes pattern = 5; // 1..256 bytes.
  bytes mask = 6; // Same length as pattern. Set bits participate in comparison.
  uint32 max_matches = 7; // Zero defaults to 64. At most 1024.
}
message ScanMemoryResponse {
  repeated uint64 addresses = 1; // Ascending match starts, including overlaps.
  bool truncated = 2; // At least one additional match was found.
}
message PreviewFunctionEntryRequest {
  string session_id = 1;
  string mapping_token = 2;
  oneof entry {
    string selector = 3; // C++ selector resolved through live DWARF.
    uint64 elf_address = 4; // Link-time ELF virtual address, not a file offset.
  }
  string module = 5; // Exact absolute mapping path for an ELF address.
  string abi = 6; // Required for an ELF address. Currently linux-x86-64-sysv.
}
message EntryInstruction {
  enum Flow {
    ORDINARY = 0;
    BRANCH = 1;
    CALL = 2;
    RETURN = 3;
  }
  uint64 address = 1;
  bytes encoding = 2;
  string assembly = 3;
  Flow flow = 4;
  optional uint64 target_address = 5; // Absent for an unresolved transfer.
  bool falls_through = 6;
}
message PreviewFunctionEntryResponse {
  enum Boundary {
    BOUNDARY_UNSPECIFIED = 0;
    DWARF = 1;
    ELF_SYMBOL = 2;
    EH_FRAME = 3;
  }
  string module = 1;
  string selector = 2;
  string abi = 3;
  uint64 elf_address = 4;
  uint64 runtime_address = 5;
  uint64 function_size = 6;
  Boundary boundary = 7;
  bytes entry_bytes = 8; // Verified against the mapped ELF and re-read live.
  uint32 patch_size = 9; // Zero if the current copy-only detour policy rejects it.
  string patch_diagnostic = 10;
  repeated EntryInstruction instructions = 11;
  bool decode_failed = 12; // A reachable instruction could not be decoded in bounds.
}
message ListThreadsRequest { string session_id = 1; }
message TargetThread {
  uint32 tid = 1;
  string name = 2;
  uint64 start_time = 3;
}
message ListThreadsResponse { repeated TargetThread threads = 1; }
message ListSymbolsRequest {
  string session_id = 1;
  string query = 2; // Case-sensitive substring of selector or linkage name.
  string module = 3; // Case-sensitive substring of mapped ELF module path.
  uint32 page_size = 4; // Zero returns all matches; positive values opt into pagination.
  string page_token = 5; // Opaque continuation token from the previous page.
  uint64 address = 6; // Nonzero PC for reverse lookup.
  string mapping_token = 7; // Required for reverse lookup.
  bool include_addresses = 8;
}
message FunctionSymbol {
  string selector = 1; // Full canonical C++ function or method signature.
  string linkage_symbol = 2;
  string module_path = 3;
  uint64 runtime_address = 4; // Zero when no unique live entry can be proven.
  uint64 elf_address = 5;
}
message ListSymbolsResponse {
  repeated FunctionSymbol symbols = 1;
  string next_page_token = 2;
  string mapping_token = 3;
}
message ListSymbolsPageToken {
  string session_id = 1;
  uint32 pid = 2;
  uint64 process_start_time = 3;
  string query = 4;
  string module = 5;
  uint32 page_size = 6;
  string mapping_fingerprint = 7;
  string last_selector = 8;
  string last_linkage_symbol = 9;
  string last_module_path = 10;
}
// Versioned, reusable selection rules. A saved manifest contains no addresses
// or session IDs and is resolved again against the selected target.
message BulkTraceRules {
  uint32 version = 1;
  repeated string module_globs = 2;
  repeated string include_globs = 3;
  repeated string exclude_globs = 4;
  repeated string exact_selectors = 5;
}
message PreviewBulkTraceRequest {
  string session_id = 1;
  BulkTraceRules rules = 2;
}
message BulkTraceCandidate {
  enum AbiStatus {
    ABI_STATUS_UNSPECIFIED = 0;
    DWARF_SUPPORTED = 1;
    PREPARED_REQUIRED = 2;
    UNSUPPORTED = 3;
    AMBIGUOUS = 4;
  }
  FunctionSymbol function = 1;
  AbiStatus abi_status = 2;
  string diagnostic = 3;
}
message PreviewBulkTraceResponse {
  repeated BulkTraceCandidate candidates = 1;
  repeated string unmatched_exact_selectors = 2;
  uint32 retained_limit = 3;
  uint32 session_retained = 4;
  optional uint32 agent_retained = 5;
  optional uint32 available_slots = 6;
}
message ApplyBulkTraceRequest {
  string session_id = 1;
  BulkTraceRules rules = 2;
  // Caller-generated 32 lowercase hexadecimal digits. Keep for removal even
  // when the RPC result is lost. Unique among retained batches in the session.
  string batch_id = 3;
  optional string callback_source = 4; // Omit for the typed PRE/POST observer.
}
message RemoveBulkTraceRequest {
  string session_id = 1;
  string batch_id = 2;
}
message BulkTraceEntry {
  enum Status {
    NOT_ATTEMPTED = 0;
    BLOCKED = 1;
    INSTALLED = 2;
    INSTALL_FAILED = 3;
    ROLLED_BACK = 4;
    REMOVED = 5;
    RESTORE_PENDING = 6;
  }
  FunctionSymbol function = 1;
  Status status = 2;
  Probe probe = 3; // Present for a retained probe, including after restoration.
  string diagnostic = 4;
}
message BulkTraceReport {
  string batch_id = 1;
  repeated BulkTraceEntry entries = 2;
  repeated string unmatched_exact_selectors = 3;
  optional uint32 available_slots = 4; // Capacity before apply.
  string diagnostic = 5;
  bool complete = 6; // Every selected entry was installed or removed as requested.
}
message WatchEventsRequest {
  repeated string session_ids = 1; // Empty subscribes to all sessions.
  uint64 after_sequence = 2;       // Resume cursor in bounded server history.
  uint32 pid = 3;                  // Optional process filter; survives session loss.
  repeated string names = 4;       // Exact function or emitted context event names; ORed.
}
message ReadEventsRequest {
  WatchEventsRequest filter = 1;
  uint32 limit = 2; // 1..256; zero uses 256.
  uint64 through_sequence = 3; // Zero snapshots the latest server sequence.
  string server_instance_id = 4; // Required when continuing a snapshot.
}
message ReadEventsResponse {
  string server_instance_id = 1;
  uint64 through_sequence = 2;
  repeated TraceEvent events = 3;
  uint64 server_dropped_events = 4;
}
message AcknowledgeEventsRequest {
  string server_instance_id = 1;
  repeated uint64 sequences = 2; // Exact stored events, at most 256.
}
message AcknowledgeEventsResponse {
  uint32 removed = 1; // Repeating an acknowledgement is harmless.
}
message Value {
  ValueType type = 1;
  oneof data {
    sint64 signed_value = 2;
    uint64 unsigned_value = 3;
    double real_value = 4;
  }
  clangtracer.context.v1.ValueSnapshot snapshot = 5;
}
message NamedValue {
  string name = 1;
  Value value = 2;
  uint32 argument_index = 3; // Used only in named_arguments.
}
message StackFrame {
  uint64 pc = 1; // Native PC, or return PC for a caller frame.
  uint64 stack_pointer = 2;
  enum Kind { NATIVE = 0; TARGET_ENTRY = 1; JIT_BRIDGE = 2; }
  Kind kind = 3;
  string module = 4;
  uint64 module_offset = 5; // ELF lookup address: entry PC, or caller return PC - 1.
  string function = 6;
  string file = 7;
  uint32 line = 8;
  bool application_frame = 9;
}
message StackTrace {
  enum Status { DISABLED = 0; COMPLETE = 1; TRUNCATED = 2; PARTIAL = 3; }
  Status status = 1;
  uint32 requested_depth = 2;
  repeated StackFrame frames = 3;
  string detail = 4;
  bool application_only = 5;
  uint32 hidden_frames = 6;
  uint32 captured_depth = 7; // Native depth before filtering; bounded by requested_depth.
  // This is the invocation's entry stack, including on POST events.
}
message TraceEvent {
  uint32 protocol_version = 1;
  string session_id = 2;
  uint64 probe_id = 3;
  uint32 pid = 4;
  uint32 tid = 5;
  uint64 sequence = 6; // Monotonic server cursor, assigned when received.
  uint64 probe_sequence =
      7; // Agent sequence; gaps expose agent transport loss.
  uint64 monotonic_time_ns = 8;
  uint64 object_address = 9; // Zero for free/static functions.
  repeated Value arguments = 10;
  sint64 callback_value = 11;
  uint64 agent_dropped_events = 12;
  uint64 server_dropped_events =
      13; // Cumulative history evictions at publication.
  TracePhase phase = 14;
  uint64 call_id = 15; // Correlates PRE/POST for one invocation of this probe.
  Value result = 16;   // Present only on POST; VOID is represented explicitly.
  repeated NamedValue named_arguments = 17;
  repeated NamedValue object_fields = 18;
  StackTrace stack = 19;
  clangtracer.context.v1.ContextEventEnvelope context = 20;
  string function_name = 21; // Bounded registered selector or linkage fallback; server-assigned.
  string server_instance_id = 22; // Unique server lifetime; sequence alone is not durable identity.
  clangtracer.context.v1.ValueSnapshot receiver_snapshot = 23;
}
