syntax = "proto3";
package clangtracer.context.v1;

// Internal, schema-neutral transport for shared-context snapshots. Descriptor
// bundles and generated payloads remain opaque serialized protobuf bytes.
service ContextTransport {
  rpc Export(stream ProducerPacket) returns (stream CollectorControl);
}

enum DeliveryProfile { DELIVERY_PROFILE_UNSPECIFIED = 0; BEST_EFFORT = 1; DURABLE = 2; }
enum RecordingOperation { RECORDING_OPERATION_UNSPECIFIED = 0; CREATE = 1; RESUME = 2; }
message ExportOpen {
  bytes producer_session_id = 1;
  uint64 epoch_id = 2;
  uint32 protocol_version = 3;
  DeliveryProfile profile = 4;
  RecordingOperation operation = 5;
  bytes recording_id = 6;
  bytes sink_id = 7;
  uint64 saved_ack_position = 8;
  uint32 max_packet_bytes = 9;
  uint32 max_event_bytes = 10;
  uint32 max_epoch_schemas = 11;
  uint64 max_epoch_schema_bytes = 12;
  // Engine-provided native process identity for restart-safe Watch routing.
  // The collector validates the current process start time before associating
  // an unknown producer session with this PID.
  uint32 native_pid = 13;
  uint64 process_start_time = 14;
}
message SchemaRecord {
  bytes schema_identity = 1;
  string root_type = 2;
  bytes serialized_file_descriptor_set = 3;
  bytes source_lineage_id = 4;
  string cpp_state_type = 5;
  string cpp_scope_type = 6;
  bytes revision_id = 7;
  repeated string container_roles = 8;
  uint64 epoch_schema_id = 9;
}
message TruncationPathStep {
  oneof value {
    uint32 field_number = 1;
    uint64 list_index = 2;
    string string_key = 3;
    sint64 signed_key = 4;
    uint64 unsigned_key = 5;
    bool bool_key = 6;
  }
}
message TruncationRecord {
  repeated TruncationPathStep path = 1;
  uint64 total_items = 2;
  uint64 captured_items = 3;
}
message ContextStackFrame {
  enum Kind { NATIVE = 0; TARGET_ENTRY = 1; JIT_BRIDGE = 2; }
  uint64 pc = 1;
  uint64 stack_pointer = 2;
  Kind kind = 3;
  string function = 4;
  string module = 5;
  string file = 6;
  uint32 line = 7;
  uint64 module_offset = 8;
  bool application_frame = 9;
}
message ContextStackTrace {
  enum Status { DISABLED = 0; COMPLETE = 1; TRUNCATED = 2; PARTIAL = 3; }
  Status status = 1;
  uint32 requested_depth = 2;
  repeated ContextStackFrame frames = 3;
  string detail = 4;
  bool application_only = 5;
  uint32 hidden_frames = 6;
  uint32 captured_depth = 7;
}
message StatePayload {
  uint64 scope_id = 1;
  bytes schema_identity = 2;
  bytes payload = 3;
  repeated TruncationRecord truncations = 4;
  uint64 epoch_schema_id = 5;
}
message EventRecord {
  bytes event_id = 1;
  bytes source_id = 2;
  uint64 source_sequence = 3;
  bytes task_id = 4;
  bytes parent_task_id = 5;
  string name = 6;
  repeated StatePayload states = 7;
  uint64 recording_position = 8;
  bytes opaque_metadata = 9;
  uint32 effective_max_items = 10;
  bytes invocation_id = 11;
  bytes probe_id = 12;
  repeated TraceArgument arguments = 13;
  repeated TraceNamedValue named_values = 14;
  TypedTraceValue result = 15;
  uint32 phase = 16;
  bytes parent_source_id = 17;
  uint64 parent_submission_sequence = 18;
  bool print_arguments = 19;
  bool print_result = 20;
  ContextStackTrace entry_stack = 21;
}
// Self-contained view for retained/queryable trace history. Only schemas
// referenced by this event are included; epoch IDs remain scoped by the
// producer session and epoch carried here.
message ContextEventEnvelope {
  bytes producer_session_id = 1;
  uint64 epoch_id = 2;
  repeated SchemaRecord schemas = 3;
  EventRecord event = 4;
}
// Native callback values are explicitly typed. Pointer and object arms carry
// only the observed address; the exporter never dereferences application data.
message TypedTraceValue {
  uint32 value_type = 1;
  oneof value {
    sint64 signed_value = 2;
    uint64 unsigned_value = 3;
    double real_value = 4;
  }
  ValueSnapshot snapshot = 5;
}
// Owned capture-time data; never a target-memory image or a borrowed address.
// Payload is a field-1 wrapper described by descriptor_set/root_type.
message ValueSnapshot {
  enum Status { UNSPECIFIED = 0; COMPLETE = 1; UNSUPPORTED = 2; LIMIT_EXCEEDED = 3; FAILED = 4; }
  string cpp_type = 1;
  string root_type = 2;
  bytes descriptor_set = 3;
  bytes payload = 4;
  Status status = 5;
  string detail = 6;
  repeated string container_roles = 7;
  repeated string record_types = 8; // protobuf message name=C++ canonical name
  repeated SnapshotMember members = 9; // Independently captured record members.
}
message SnapshotMember {
  string name = 1;
  ValueSnapshot snapshot = 2;
}
message TraceArgument {
  uint32 index = 1;
  string name = 2;
  TypedTraceValue value = 3;
}
message TraceNamedValue {
  uint32 kind = 1;
  uint32 argument_index = 2;
  string name = 3;
  TypedTraceValue value = 4;
}
message ContextFrame {
  oneof body { SchemaRecord schema = 1; EventRecord event = 2; }
}
// Capture-time logical batch. The exporter reserves the complete schema set
// and event capacity before binding epoch-local IDs or writing any member.
message ContextBatch {
  repeated SchemaRecord schemas = 1;
  EventRecord event = 2;
}
message ExportCounters {
  uint64 capture_failed = 1;
  uint64 queue_dropped = 2;
  uint64 transport_uncertain = 3;
  uint64 journal_dropped = 4;
}
message ProducerPacket {
  oneof body { ExportOpen open = 1; ContextFrame data = 2; ExportCounters counters = 3; }
}
message StreamReady {
  uint32 protocol_version = 1;
  uint32 max_packet_bytes = 2;
  uint32 max_event_bytes = 3;
  uint32 max_epoch_schemas = 4;
  uint64 max_epoch_schema_bytes = 5;
  DeliveryProfile accepted_profile = 6;
}
message StreamFlow { bool paused = 1; }
message DurableControl {
  enum Result { RESULT_UNSPECIFIED = 0; ACCEPTED = 1; REFUSED = 2; }
  Result result = 1;
  RecordingOperation operation = 2;
  bytes recording_id = 3;
  uint64 durable_prefix = 4;
  string detail = 5;
}
message CollectorControl {
  uint64 epoch_id = 1;
  oneof body { StreamReady ready = 2; StreamFlow flow = 3; DurableControl durable = 4; }
}
