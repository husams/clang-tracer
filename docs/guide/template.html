<script>
const sidebar = document.querySelector('#sidebar');
const toggle = document.querySelector('#nav-toggle');
const narrow = matchMedia('(max-width: 52rem)');
const filter = document.querySelector('#nav-filter');
const groups = [...sidebar.querySelectorAll('.nav-group')];
const links = [...sidebar.querySelectorAll('.subnav a')];
const copyStatus = document.querySelector('#copy-status');

function showNavigation(open) {
  sidebar.hidden = !open;
  document.body.classList.toggle('nav-closed', !open);
  toggle.setAttribute('aria-expanded', String(open));
}

function highlightLocation() {
  const current = links.find(link => link.hash === location.hash);
  for (const link of links) link.removeAttribute('aria-current');
  if (current) {
    current.setAttribute('aria-current', 'location');
    current.closest('details').open = true;
  } else {
    groups[0].querySelector('details').open = true;
  }
}

showNavigation(!narrow.matches);
highlightLocation();
narrow.addEventListener('change', () => showNavigation(!narrow.matches));
window.addEventListener('hashchange', highlightLocation);
toggle.addEventListener('click', () => showNavigation(sidebar.hidden));
sidebar.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    showNavigation(false);
    toggle.focus();
  }
});
sidebar.addEventListener('click', event => {
  if (narrow.matches && event.target.closest('a[href^="#"]')) {
    showNavigation(false);
    document.querySelector('#content').focus({preventScroll: true});
  }
});

filter.addEventListener('input', () => {
  const query = filter.value.trim().toLowerCase();
  let matched = false;
  for (const group of groups) {
    let any = false;
    for (const item of group.querySelectorAll('li')) {
      const titleMatches = item.querySelector('summary').textContent.toLowerCase().includes(query);
      let found = false;
      for (const link of item.querySelectorAll('a')) {
        link.hidden = !titleMatches && !link.textContent.toLowerCase().includes(query);
        found ||= !link.hidden;
      }
      item.hidden = !found;
      if (query && found) item.querySelector('details').open = true;
      any ||= found;
    }
    group.hidden = !any;
    matched ||= any;
  }
  document.querySelector('#no-sections').hidden = matched;
});

let statusTimer;
document.querySelector('main').addEventListener('click', async event => {
  const button = event.target.closest('.copy');
  if (!button) return;
  const code = button.closest('.code-block').querySelector('code');
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(code.textContent);
    } else {
      const range = document.createRange();
      range.selectNodeContents(code);
      const selection = getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      if (!document.execCommand('copy')) throw new Error('Clipboard unavailable');
      selection.removeAllRanges();
    }
    copyStatus.textContent = 'Copied to clipboard';
  } catch {
    copyStatus.textContent = 'Select the code and copy it manually';
  }
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { copyStatus.textContent = ''; }, 2500);
});
</script>
